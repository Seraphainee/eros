# Build e release de APK Flutter
#
# - Dispara em push para main/master
# - Permite execução manual (workflow_dispatch)
# - Roda em Ubuntu (build Android)
# - Configura Flutter e Java automaticamente
# - Compila APK release
# - Sobe APK como artifact (90 dias) e cria Release (opcional)

name: Build Release APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write  # Necessário para criar a Release quando o upload-artifact falhar

jobs:
  build:
    name: Build APK Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Mostrar versões
        run: |
          flutter --version
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Habilitar web/desktop não usados (acelera build)
        run: |
          flutter config --no-enable-web
          flutter config --no-enable-linux-desktop
          flutter config --no-enable-macos-desktop
          flutter config --no-enable-windows-desktop
          flutter config --no-enable-ios
          flutter config --no-enable-android  # Apenas o build direto, não o tooling

      - name: Restaurar dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze --no-pub
        continue-on-error: true  # Não bloqueia o build por warnings

      - name: Regenerar Gradle Wrapper
        run: |
          cd android
          curl -L -o gradle-9.1.0-bin.zip https://services.gradle.org/distributions/gradle-9.1.0-bin.zip
          unzip -q gradle-9.1.0-bin.zip
          ./gradle-9.1.0/bin/gradle wrapper --gradle-version 9.1.0 --distribution-type bin
          rm -rf gradle-9.1.0 gradle-9.1.0-bin.zip

      - name: Compilar APK Release
        run: flutter build apk --release
        env:
          # Configurações de mock para o app compilar sem backend.
          # Em produção, defina estas como secrets no GitHub.
          VOICE_STUB: 'true'
          LIVEKIT_URL: 'wss://stub.example.com'
          FIREBASE_PROJECT_ID: 'eros-dev'

      - name: Listar artefatos gerados
        run: |
          echo "=== APK files ==="
          find build -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload do APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Criar Release no GitHub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}
          name: Build #${{ github.run_number }} (${{ github.sha }})
          body: |
            Build automático do APK de release.

            **Commit:** ${{ github.sha }}
            **Autor:** ${{ github.actor }}
            **Data:** ${{ github.event.repository.updated_at }}
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
