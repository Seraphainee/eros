name: eros
description: Aplicativo de comunicação em tempo real (texto + voz) inspirado em Discord/RaidCall
version: 1.0.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  connectivity_plus: ^7.3.1
  permission_handler: ^11.3.0
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.4
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  image_picker: ^1.0.7
  flutter_local_notifications: ^16.3.2
  flutter_webrtc: ^1.2.1
  livekit_client: ^2.8.1
  http: ^1.2.0
  url_launcher: ^6.2.2
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  logger: ^2.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  custom_lint: ^0.6.0

# Resolver conflito entre livekit_client >=2.4.4 (exige path ^1.9.1)
# e flutter_test (fixa path 1.9.0 via SDK pinning).
dependency_overrides:
  path: 1.9.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
